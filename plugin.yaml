name: proactive-hermes
label: Proactive Hermes
kind: standalone
version: 1.0.0
author: HeyRito.AI
homepage: https://heyrito.ai
description: >
  A quiet, proactive executive-assistant desk for Hermes. Scheduled jobs read your mail,
  calendar, Slack and Linear, and only what you must do or decide reaches you: one short
  numbered message in your chat, nothing at night unless it is urgent. It tracks what you
  promised people, searches every source before asking you and brings a ready draft, and
  recaps your team's daily call against Linear and Slack. Read-only: it never sends, posts,
  books or pays. Set up with `hermes proactive setup` (Juan's setup or your own answers).
requires_hermes: ">=0.23.4"
provides_tools: []
provides_hooks: [pre_llm_call]
optional_env:
  - name: OPENAI_API_KEY
    description: "Optional. Enables the fast decision filter (OpenAI Decisions API, gpt-6-luna): noise filtering and promise checks for about 3 cents per 1,000 emails. Recommended for Juan's setup."
    url: https://platform.openai.com/api-keys
    secret: true
