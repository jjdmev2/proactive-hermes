name: proactive-hermes
label: Proactive Hermes
kind: standalone
version: 1.0.0
author: HeyRito.AI
homepage: https://heyrito.ai
description: >
  A proactive executive-assistant desk for Hermes. Scheduled jobs and your own watches read
  mail, calendar, Slack, Linear, marketplaces, shops and event pages. Only what needs you
  reaches your chat: one short numbered message, nothing at night unless it is urgent. It
  tracks your promises, brings ready drafts, blocks trips and tells you when to leave, and
  sets phone reminders and alarms. It acts only within the approval levels you choose;
  sending, buying and registering wait for your yes. Set up with /proactive setup.
requires_hermes: ">=0.23.4"
provides_tools: []
provides_hooks: [pre_llm_call]
optional_env:
  - name: OPENAI_API_KEY
    description: "Optional fallback for the decision filter, used only where Hermes shows it to the plugin. Scheduled runs need PROACTIVE_OPENAI_API_KEY."
    url: https://platform.openai.com/api-keys
    secret: true
# Shown in Settings -> Plugins -> Proactive Hermes and in `hermes plugins config proactive-hermes`. Secrets are
# Hermes secrets read with get_secret, never from a file.
config_schema:
  decisions_api_key:
    type: secret
    env: PROACTIVE_OPENAI_API_KEY
    label: "OpenAI key for the decision filter (optional)"
    description: "Turns on the fast decision filter: noise out and promises spotted, about 3 cents per 1,000 emails. It can be the same key as OPENAI_API_KEY. It is needed because Hermes hides provider keys from scheduled scripts."
  # Instant mail push (optional). Each filled Mailbox slot gets IMAP IDLE: new mail wakes the mail radar within
  # 1 to 3 minutes instead of at the next 15 min check. The app password (PROACTIVE_MAIL_<N>_PASSWORD) is used only to
  # log in to that IMAP server.
  mail_1_address:
    type: str
    label: "Mailbox 1 address"
    description: "Mailbox 1 address for instant mail push (optional)"
  mail_1_password:
    type: secret
    env: PROACTIVE_MAIL_1_PASSWORD
    label: "Mailbox 1 app password"
    description: "App password for Mailbox 1, made on your mail provider's site. Not your normal password."
  mail_1_host:
    type: str
    label: "Mailbox 1 IMAP server"
    description: "Only if your address does not end in gmail.com, icloud.com, me.com, mac.com, fastmail.com or a yahoo domain. For a work Gmail on your company's domain use imap.gmail.com. Outlook, Hotmail, Live and Microsoft 365 allow only Microsoft's own sign-in, no app passwords, so they stay on 15 min checks (optional)"
  mail_1_port:
    type: int
    default: 993
    label: "Mailbox 1 IMAP port"
    description: "Leave at 993 unless your provider says otherwise (optional)"
  mail_2_address:
    type: str
